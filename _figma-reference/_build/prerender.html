<!doctype html>
<html><body><pre id="out">running</pre>
<script>
// Loads each product page in an iframe at the width of each layout (1440 / 991 / 430), lets js/v2.js
// re-flow the paragraphs with the real fonts, then hands back the finished <section> markup.
const PAGES = ['consent.html', 'consent-guide.html', 'consent-pricing.html', 'consent-piftick.html',
  'pils.html', 'pils-guide.html', 'pils-pricing.html', 'pils-piftick.html', 'pils-legal.html'];
const WIDTH = { d: 1440, t: 991, m: 430 };
async function grab(page, bp) {
  const f = document.createElement('iframe');
  f.style.cssText = `position:absolute;left:-6000px;top:0;width:${WIDTH[bp]}px;height:900px;border:0`;
  document.body.appendChild(f);
  await new Promise(r => { f.onload = r; f.src = '/' + page; });
  const d = f.contentDocument;
  await d.fonts.ready;
  await new Promise(r => setTimeout(r, 1500));
  const sec = d.querySelector('section.fv-' + bp);
  let html = null;
  if (sec && sec.offsetParent !== null) {
    sec.querySelectorAll('.lgn').forEach(n => n.style.removeProperty('height'));   // set again at runtime
    html = sec.innerHTML;
    if (sec.querySelector('[data-flow]')) html = null;                          // not finished: leave the page as is
  }
  f.remove();
  return html;
}
(async () => {
  const res = {};
  for (const p of PAGES) for (const bp of ['d', 't', 'm']) {
    const h = await grab(p, bp);
    if (h) res[p + '|' + bp] = h;
  }
  document.getElementById('out').textContent = 'JSON_START' + JSON.stringify(res) + 'JSON_END';
})();
</script></body></html>
